name: ci
on: [push, pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check cortex tests --select E,F,W --ignore E501,E702,E731
      - name: Unit and integration tests (offline, deterministic)
        run: python -m pytest -q
      - name: Build data and indexes
        run: python -m cortex.cli init --synthetic
      - name: Eval gate (accuracy, red team, row-level security)
        run: python -m cortex.cli eval --gate
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: evals/REPORT.md }
